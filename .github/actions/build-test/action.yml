name: "Build and Test"
description: "Install deps, build and test the Chat SDK (shared by CI and publish workflows)"
inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "22.14.0" # pinned >= the OIDC minimum (Node 22.14); major-only "22" can resolve below it
  run-checks:
    description: "Run lint + format checks before build+test (enable for PR CI)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Deliberately NO registry-url: it makes setup-node write an .npmrc line
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With no token that empty value is
        # treated as "auth configured", which suppresses npm's native OIDC and fails `npm publish`
        # with ENEEDAUTH (semantic-release/npm#1069, actions/setup-node#1440). OIDC trusted
        # publishing needs no .npmrc at all — just id-token: write + npm >= 11.5.1.
        cache: "npm"
    - name: Upgrade npm (trusted publishing needs >= 11.5.1)
      shell: bash
      # Pinned for deterministic builds; bump intentionally (must stay >= 11.5.1 for OIDC).
      # On 11.5.1 (npm's first OIDC release) semantic-release's `npm publish --userconfig ...`
      # failed to engage native OIDC (ENEEDAUTH); 11.16.0 carries a year of OIDC fixes.
      run: npm install -g npm@11.16.0
    - name: Install dependencies
      shell: bash
      run: npm ci
    # Run lint + format as non-mutating gates BEFORE build/test, so build/test exercise the actual
    # committed code rather than code an `eslint --fix` / `prettier --write` may have rewritten
    # afterwards. prettier:check is scoped to first-party src/tests (a repo-wide check fails on
    # pre-existing unrelated files such as the semantic-release-managed CHANGELOG.md).
    - name: Lint and check formatting
      if: ${{ inputs.run-checks == 'true' }}
      shell: bash
      run: |
        npm run lint
        npm run prettier:check
    - name: Build
      shell: bash
      run: npm run build
    - name: Test
      shell: bash
      run: npm run test
